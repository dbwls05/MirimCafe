<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/post.css" />
    <link rel="stylesheet" href="./css/dropdown.css" />
  </head>
  <body>
    <div id="header"></div>

    <div class="post-actions">
      <button id="edit-btn" style="display: none">수정</button>

      <button id="delete-btn" style="display: none">삭제</button>
    </div>

    <div class="post-container">
      <div class="post-card">
        <h1 id="title"></h1>

        <div class="post-meta">
          <span id="author"></span>
          <span id="updated"></span>
          <span id="date"></span>
        </div>

        <hr />

        <div id="content"></div>
      </div>
    </div>

    <script type="module" src="./src/post.js"></script>
    <script type="module" src="./src/header.js"></script>
  </body>
</html>
