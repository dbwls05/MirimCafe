<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>게시글 수정</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/dropdown.css" />
  </head>
  <body>
    <div id="header"></div>

    <div class="edit-container">
      <h1>게시글 수정</h1>

      <input type="text" id="title" placeholder="제목을 입력하세요" />

      <textarea
        id="content"
        rows="10"
        placeholder="내용을 입력하세요"
      ></textarea>

      <button id="save-btn">수정 완료</button>
    </div>

    <script type="module" src="./src/edit-post.js"></script>
    <script type="module" src="./src/header.js"></script>
  </body>
</html>
