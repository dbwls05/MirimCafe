<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>카페 만들기</title>
    <link rel="stylesheet" href="css/createCafe.css" />
  </head>
  <body>
    <div class="create-box">
      <a href="./index.html" class="back-btn">← 홈으로</a>
      <h1>카페 만들기</h1>
      <p class="desc">나만의 카페를 만들어보세요</p>

      <label for="cafe-name">카페 이름</label>
      <input type="text" id="cafe-name" placeholder="카페 이름" />

      <label for="cafe-description">카페 설명</label>
      <textarea
        id="cafe-description"
        maxlength="200"
        placeholder="카페 설명"
      ></textarea>

      <button id="create-btn">생성하기</button>
    </div>

    <script type="module" src="./src/create-cafe.js"></script>
  </body>
</html>
