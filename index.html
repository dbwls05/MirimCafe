<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mirim Cafe</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: #eef3ee;
        font-family: "Pretendard", sans-serif;
        color: #111;
      }

      .container {
        width: 90%;
        margin: 0 auto;
      }

      /* 헤더 */
      header {
        height: 120px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .logo {
        font-size: 56px;
        font-weight: 500;
      }

      .auth {
        font-size: 20px;
        cursor: pointer;
      }

      /* 섹션 */
      section {
        margin-top: 40px;
      }

      h2 {
        font-size: 48px;
        margin-bottom: 30px;
        font-weight: 500;
      }

      /* 내가 가입한 카페 */
      .joined-box {
        width: 80%;
        height: 70px;
        margin: 0 auto;
        background: #ddd;
        border-radius: 20px;

        display: flex;
        justify-content: center;
        align-items: center;

        font-size: 20px;
      }

      /* 카페 목록 */
      .cafe-list {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 30px;
      }

      .cafe-card {
        background: #f3f3f3;
        border-radius: 20px;
        overflow: hidden;
        cursor: pointer;
        transition: 0.2s;
      }

      .cafe-card:hover {
        transform: translateY(-5px);
      }

      .cafe-image {
        height: 220px;
        background: #d9d9d9;
      }

      .cafe-info {
        padding: 15px;
      }

      .cafe-title {
        font-size: 22px;
        margin-bottom: 10px;
      }

      .cafe-desc {
        font-size: 16px;
        color: #444;
      }

      @media (max-width: 1200px) {
        .cafe-list {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      @media (max-width: 768px) {
        .cafe-list {
          grid-template-columns: 1fr;
        }

        .logo {
          font-size: 40px;
        }

        h2 {
          font-size: 32px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <div class="logo">Mirim Cafe</div>

        <div class="auth">로그인/회원가입</div>
      </header>

      <section>
        <h2>내가 가입한 카페</h2>

        <div class="joined-box">가입한 카페를 보려면 로그인하세요</div>
      </section>

      <section>
        <h2>전체 카페 목록</h2>

        <div class="cafe-list" id="cafeList"></div>
      </section>
    </div>
  </body>
</html>
