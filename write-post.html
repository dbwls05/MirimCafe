<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>게시글 작성</title>

    <link rel="stylesheet" href="./css/write-post.css" />
  </head>
  <body>
    <div class="write-box">
      <h1>게시글 작성</h1>

      <input type="text" id="title" placeholder="제목을 입력하세요" />

      <textarea id="content" placeholder="내용을 입력하세요"></textarea>

      <select id="visibility">
        <option value="public">전체 공개</option>

        <option value="member">가입자만</option>
      </select>

      <button id="write-btn">작성하기</button>
    </div>

    <script type="module" src="./src/write-post.js"></script>
  </body>
</html>
