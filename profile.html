<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mirim Cafe - 프로필</title>
    <link rel="stylesheet" href="./css/profile.css" />
  </head>
  <body>
    <div id="header"></div>
    <div class="profile-card">
      <div class="profile-image">
        <img
          id="profile-img"
          src="https://placehold.co/150x150"
          alt="프로필 이미지"
        />
      </div>

      <h2 id="nickname">닉네임</h2>

      <p id="email">이메일</p>

      <p id="created-at">가입일</p>

      <button id="edit-btn">프로필 수정</button>

      <button id="delete-btn">계정 삭제</button>

      <button id="home-btn">메인으로</button>
    </div>
    <script type="module" src="./src/header.js"></script>
    <script type="module" src="./src/profile.js"></script>
  </body>
</html>
